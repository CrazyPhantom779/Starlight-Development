# Monkey Species
- type: species
  id: Monkey
  name: species-name-monkey
  roundStart: false
  prototype: MobMonkey
  sprites: MobMonkeySprites
  markingLimits: MobMonkeyMarkingLimits
  dollPrototype: MobMonkeyDummy
  skinColoration: HumanToned

- type: speciesBaseSprites
  id: MobMonkeySprites
  sprites:
    Head: MobMonkeyHead
    Chest: MobMonkeyTorso
    Eyes: MobMonkeyEyes
    LArm: MobMonkeyLArm
    RArm: MobMonkeyRArm
    LHand: MobMonkeyLHand
    RHand: MobMonkeyRHand
    LLeg: MobMonkeyLLeg
    RLeg: MobMonkeyRLeg
    LFoot: MobMonkeyLFoot
    RFoot: MobMonkeyRFoot
    Tail: MobMonkeyTail

- type: markingPoints
  id: MobMonkeyMarkingLimits
  points: {}

