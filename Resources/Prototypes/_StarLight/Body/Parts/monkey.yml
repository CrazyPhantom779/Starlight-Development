    sprite: _Starlight/Mobs/Animals/Monkey/parts.rsi
  - type: Icon
    sprite: _Starlight/Mobs/Animals/Monkey/parts.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 2
      - ReagentId: Blood
        Quantity: 8

