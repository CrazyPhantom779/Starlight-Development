- type: entity
  id: PartAbductor
  parent: BasePart
  name: "Abductor body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _Starlight/Mobs/Species/Abductor/parts.rsi
  - type: Icon
    sprite: _Starlight/Mobs/Species/Abductor/parts.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 3
      - ReagentId: Sugar
        Quantity: 10

