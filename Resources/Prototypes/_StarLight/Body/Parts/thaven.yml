    sprite: _Starlight/Mobs/Species/Thaven/parts.rsi
  - type: Icon
    sprite: _Starlight/Mobs/Species/Thaven/parts.rsi
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

