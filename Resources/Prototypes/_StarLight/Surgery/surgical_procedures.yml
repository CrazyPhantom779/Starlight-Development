- type: entity
  id: ProcedureAmputateArm
  name: "Arm Amputation"
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgicalProcedure
    description: "Safe removal of an arm at the shoulder joint."
    targetBodyPartTypes:
      - Arm
    requiredEndStates:
      - BoneSawed
      - Cauterized
      - Sutured
      - Clean
    forbiddenEndStates:
      - Bleeding
      - Infected
      - Hemorrhaging
      - Dirty
    requiredIntermediateStates:
      - Incised
      - CutOpen
      - Clamped
    completionRewards:
      healDamage:
        groups:
          Brute: -10
      clearStates:
        - BoneSawed
        - Sutured
      amputate: true
    failureConsequences:
      ifMissing:
        Cauterized:
          damage:
            types:
              Bloodloss: 50
          addStates:
            - Hemorrhaging
        Sutured:
          damage:
            groups:
              Brute: 20
          infectionChanceIncrease: 0.4
      ifPresent:
        Dirty:
          infectionChanceIncrease: 0.6
        Torn:
          damage:
            groups:
              Brute: 15
    priority: 50

