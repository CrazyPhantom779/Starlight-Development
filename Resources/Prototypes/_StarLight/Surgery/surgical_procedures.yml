- type: entity
  id: ProcedureReattachArm
  name: "Arm Reattachment"
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgicalProcedure
    description: "Surgical reattachment of a severed arm."
    targetBodyPartTypes:
      - Arm
    requiredEndStates:
      - BoneSet
      - VesselsSutured
      - NervesSutured
      - Sutured
      - Sterile
    forbiddenEndStates:
      - Bleeding
      - Infected
      - Necrotic
    requiredIntermediateStates:
      - BoneDrilled
      - Retracted
      - Clamped
    completionRewards:
      restoreLimb: true
      healDamage:
        groups:
          Brute: -20
    failureConsequences:
      ifMissing:
        BoneSet:
          damage:
            groups:
              Brute: 30
          message: "The limb is reattached incorrectly and will need to be re-amputated!"
          permanent: true
        VesselsSutured:
          addStates:
            - Necrotic
          message: "Without blood flow, the limb begins to necrotize!"
        NervesSutured:
          debuff: "LimbNumbness"
          message: "The limb is reattached but has no sensation."
      ifPresent:
        Infected:
          addStates:
            - Necrotic
          damage:
            groups:
              Toxin: 15
    priority: 40

