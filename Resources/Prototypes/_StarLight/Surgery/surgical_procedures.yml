- type: entity
  id: ProcedureExtractBrain
  name: "Brain Extraction"
  categories: [ HideSpawnMenu ]
  components:
  - type: SurgicalProcedure
    description: "Careful removal of the brain from the skull."
    targetBodyPartTypes:
      - Head
    targetOrganTypes:
      - brain
    requiredEndStates:
      - SkullOpen
      - OrganRemoved
      - Bandaged
    forbiddenEndStates:
      - Bleeding
    requiredIntermediateStates:
      - BoneSawed
      - Retracted
      - Incised
    completionRewards:
      extractOrgan:
        organ: "brain"
        condition: 1.0
    failureConsequences:
      ifMissing:
        Retracted:
          extractOrgan:
            organ: "brain"
            condition: 0.5
          damage:
            groups:
              Brute: 30
      ifPresent:
        Torn:
          extractOrgan:
            organ: "brain"
            condition: 0.2
          message: "The brain is mangled and barely recognizable."
    priority: 30

