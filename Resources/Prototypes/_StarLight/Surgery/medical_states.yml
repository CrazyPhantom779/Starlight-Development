
# CLEANLINESS STATES

- type: medicalState
  id: Clean
  name: "Clean"
  description: "Surgical field is clean and ready for incision."
  visible: false

- type: medicalState
  id: Dirty
  name: "Dirty"
  description: "Surgical field is dirty and needs cleaning to reduce infection risk."
  visible: false

- type: medicalState
  id: Bloodied
  name: "Bloodied"
  description: "Blood is present on the surface, obscuring visibility."
  visible: true

- type: medicalState
  id: Sterile
  name: "Sterile"
  description: "Surgical field has been sterilized (better than clean)."
  visible: false

- type: medicalState
  id: Contaminated
  name: "Contaminated"
  description: "Surface is contaminated with toxins or chemicals."
  visible: true

- type: medicalState
  id: Decontaminated
  name: "Decontaminated"
  description: "Surgical site has been decontaminated after exposure."
  visible: false

