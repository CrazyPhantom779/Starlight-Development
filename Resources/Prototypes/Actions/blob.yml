# Actions

- type: entity
  parent: BaseAction
  id: CreateBlobFactory
  name: blob-create-factory-action-name
  description: blob-create-factory-action-desc
  components:
  - type: Action
    icon:
      sprite: _Starlight/Interface/Actions/actions_blob.rsi
      state: blobFactory
  - type: WorldTargetAction
    event: !type:BlobCreateFactoryActionEvent
    range: 200
    checkCanAccess: false

