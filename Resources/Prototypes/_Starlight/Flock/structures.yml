  - type: FlockConverted
    scrapValue: 10

- type: entity
  parent: Table
  id: FlockTable
  name: flock table
  description: A table of teal glass.
  components:
  - type: Sprite
    color: "#7fd6c8"
  - type: FlockConverted
    scrapValue: 10
