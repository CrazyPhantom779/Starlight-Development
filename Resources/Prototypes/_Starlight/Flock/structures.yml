  components:
  - type: Sprite
    sprite: _Starlight/Flock/Placeholders/wall.rsi
    color: "#7fd6c8"
  - type: Icon
    sprite: _Starlight/Flock/Placeholders/wall.rsi
  - type: IconSmooth
    key: walls
    base: brick
  - type: FlockConverted
    scrapValue: 20

- type: entity
  parent: Airlock
  id: FlockDoor
  name: flock door
  description: A door that has opinions about who may pass.
  components:
  - type: Sprite
    color: "#7fd6c8"
  - type: FlockConverted
    scrapValue: 20

- type: entity
  parent: Window
  id: FlockWindow
  name: flock window
  description: Teal glass. It is looking back.
  components:
  - type: Sprite
    color: "#7fd6c8"
  - type: FlockConverted
    scrapValue: 20

- type: entity
  parent: Grille
  id: FlockGrille
  name: flock fibrenet
  description: A mesh of fine teal wire.
  components:
  - type: Sprite
