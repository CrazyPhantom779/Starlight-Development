# Flockmind, Flocktrace and Flockdrone abilities.

- type: entity
  parent: BaseMentalAction
  id: ActionFlockSpawnRift
  name: Spawn Rift
  description: Tear open a rift into the station. Choose carefully, you only get one attempt.
  components:
  - type: Action
    useDelay: 0
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: spawn_egg
  - type: TargetAction
    range: 1000
    repeat: false
  - type: WorldTargetAction
    event: !type:FlockSpawnRiftEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockPing
  name: Ping
  description: Draw your flock's attention to a location.
  components:
  - type: Action
    useDelay: 0.3
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: ping
  - type: TargetAction
    range: 1000
    repeat: false
  - type: WorldTargetAction
    event: !type:FlockPingEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockPanel
  name: Flock Panel
  description: Open the flock overview - drones, compute, structures and enemies.
  components:
  - type: Action
    useDelay: 0
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: question_mark
  - type: InstantAction
    event: !type:FlockOpenPanelEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockDesignateTile
  name: Designate Priority Tile
  description: Mark a tile as a conversion priority for your flock.
  components:
  - type: Action
    useDelay: 0.5
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: designate_tile
  - type: TargetAction
    range: 1000
    repeat: false
  - type: WorldTargetAction
    event: !type:FlockDesignateTileEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockDesignateEnemy
  name: Designate Enemy
  description: Mark a creature as an enemy of the flock. Marked enemies are attacked on sight.
  components:
  - type: Action
    useDelay: 0.5
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: designate_enemy
  - type: TargetAction
    range: 1000
    repeat: false
  - type: EntityTargetAction
    event: !type:FlockDesignateEnemyEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockDesignateIgnore
  name: Designate Ignore
  description: Mark a creature or thing the flock should leave alone.
  components:
  - type: Action
    useDelay: 0.5
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: designate_ignore
  - type: TargetAction
    range: 1000
    repeat: false
  - type: EntityTargetAction
    event: !type:FlockDesignateIgnoreEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockPartitionMind
  name: Partition Mind
  description: Split off a flocktrace to control more of the flock. Costs 100 compute while it exists.
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: partition_mind
  - type: InstantAction
    event: !type:FlockPartitionMindEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockDiffract
  name: Diffract Drone
  description: Break one of your drones apart into flockbits.
  components:
