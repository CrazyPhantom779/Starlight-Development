    event: !type:FlockLayEggEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockFloorRun
  name: Floor Run
  description: Run along flock floor at high speed. Leaving flock floor ends it.
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: move-run
  - type: InstantAction
    event: !type:FlockFloorRunEvent {}

