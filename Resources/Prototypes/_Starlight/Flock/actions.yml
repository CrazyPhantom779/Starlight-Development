    event: !type:FlockMarkDeconstructEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockSpray
  name: Nanite Spray
  description: Use your nanites on a target. What it does depends on your spray mode.
  components:
  - type: Action
    useDelay: 0.5
    itemIconStyle: NoItem
    checkCanInteract: true
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: converter0
  - type: TargetAction
    range: 2.6
    repeat: false
  - type: WorldTargetAction
    event: !type:FlockSprayEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockSprayMode
  name: Cycle Spray Mode
  description: Cycle between convert, repair, barricade and reclaim.
  components:
  - type: Action
    useDelay: 0.3
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: converter1
  - type: InstantAction
    event: !type:FlockSprayModeEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockIncapacitor
  name: Incapacitor
  description: Fire a bolt that drops non-flock targets. Uses charge, which recharges faster on flock floors.
