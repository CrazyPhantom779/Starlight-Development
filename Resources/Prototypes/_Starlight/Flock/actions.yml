- type: entity
  parent: BaseMentalAction
  id: ActionFlockMarkDeconstruct
  name: Mark For Deconstruction
  description: Mark a flock structure so your drones tear it down.
  components:
  - type: Action
    useDelay: 0.5
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: destroystructure
