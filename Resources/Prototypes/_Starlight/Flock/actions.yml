  - type: Action
    useDelay: 1.2
    itemIconStyle: NoItem
    checkCanInteract: true
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: incapacitor0
  - type: TargetAction
    range: 12
    repeat: false
  - type: WorldTargetAction
    event: !type:FlockIncapacitorEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockCage
  name: Imprison
  description: Lock a downed creature in a flock cage. Needs them to be stunned, down or in crit.
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: NoItem
    checkCanInteract: true
    icon:
      sprite: _Starlight/Flock/featherzone.rsi
      state: cage
  - type: TargetAction
    range: 2.6
    repeat: false
  - type: WorldTargetAction
    event: !type:FlockCageEvent {}

- type: entity
  parent: BaseMentalAction
  id: ActionFlockLayEgg
  name: Lay Egg
  description: Spend resources to lay an egg that hatches into a new drone.
  components:
  - type: Action
    useDelay: 8
    itemIconStyle: NoItem
    checkCanInteract: false
    icon:
      sprite: _Starlight/Flock/flock-ui.rsi
      state: spawn_egg
