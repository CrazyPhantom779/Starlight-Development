# Brain Chip
- type: entity
  parent: BaseItem
  id: HologramBrainChip
  name: hologram brain chip
  description: A chip containing the neural data for holographic projection. The cortical stack of a vox.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Devices/cortical_stack.rsi
    layers:
    - state: cortical-stack
  - type: Item
    size: Small
  - type: HologramBrainChip
  - type: MindContainer
  - type: Speech
  - type: TypingIndicator
    proto: robot
  - type: Physics
    bodyType: KinematicController
  - type: Actions
  - type: HologramConsole
    maxActiveHolograms: 1
    showMap: true
    showProjectButton: true
    showRecallButton: true
    showBladeServerPanel: true
  - type: HologramActionGrant
    grantConsoleAction: true
    grantLawsAction: true
    grantConsoleActionWhileContainedInPoweredRack: true
  - type: SiliconLawBound
  - type: SiliconLawProvider
    laws: Drone
  - type: UserInterface
    interfaces:
      enum.HologramConsoleUiKey.Key:
        type: HologramConsoleBoundUserInterface
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
  - type: Vocal
    sounds:
      Male: UnisexSilicon
      Female: UnisexSilicon
      Unsexed: UnisexSilicon
    screamId: Scream
    screamAction: ActionScream
  - type: Tag
    tags:
    - HologramBrainChip

# Body Chip
- type: entity
  parent: BaseItem
  id: HologramBodyChip
  name: hologram body chip
  description: A chip containing the physical appearance data for holographic projection.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Devices/body_chip.rsi
    state: body-chip
  - type: Item
    size: Small
  - type: HologramBodyChip
  - type: Tag
    tags:
      - HologramBodyChip

# Holo Corgi Body Chip
- type: entity
  parent: HologramBodyChip
  id: HologramBodyChipCorgi
  name: hologram body chip (holo corgi)
  description: A chip pre-programmed with Holo Corgi appearance data.
  components:
  - type: HologramBodyChip
    hologramPrototype: MobCorgiHolo
    hologramName: "Holo Corgi"

- type: entity
  parent: HologramBrainChip
  id: HologramStuntedBrainChip
  name: stunted hologram mind chip
  description: A limited hologram processor that can project an autonomous body, but cannot store a consciousness.
  components:
  - type: HologramBrainChip
    allowAutonomousProjection: true
    preventMindStorage: true
  - type: HologramActionGrant
    grantConsoleAction: false
    grantLawsAction: false
