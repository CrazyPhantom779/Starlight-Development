- type: entity
  parent: BaseAction
  id: ActionMedTek
  name: Analyze Patient
  components:
  - type: Action
    icon:
      sprite: Objects/Specific/Medical/healthanalyzer.rsi
      state: icon
    itemIconStyle: BigAction
    checkCanInteract: false
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:MedTekActionEvent

- type: entity
  parent: BaseItem
  id: NanoChatCartridge
  name: NanoChat cartridge
  description: Lets you message other people!
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Devices/cartridge.rsi
    state: cart-chat
  - type: UIFragment
    ui: !type:NanoChatUi
  - type: NanoChatCartridge
  - type: Cartridge
    programName: nano-chat-program-name
    icon:
      sprite: _Starlight/Misc/program_icons.rsi
      state: nanochat
  - type: ActiveRadio
    channels:
    - Common
