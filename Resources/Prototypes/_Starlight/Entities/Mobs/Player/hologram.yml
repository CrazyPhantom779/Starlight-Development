- type: entity
  abstract: true
  parent:
  - BaseMob
  - StripableInventoryBase
  id: BaseHologramHumanoid
  name: hologram
  components:
  - type: Hologram
    shaderName: HologramProjection
    color1: "#65b8e2"
    color2: "#3a6981"
    hue: 0.64
    saturation: 0.95
    alpha: 0.82
    intensity: 1.6
    colorBlend: 0.6
    scanlineOpacity: 0.45
    noiseOpacity: 0.35
    flickerStrength: 0.2
    lineScrollSpeed: 0.14
    defaultVisibility: 0.9
    offset: 0, 0
  - type: MovementIgnoreGravity
  - type: NoSlip
  - type: Stealth
    lastVisibility: 0.9
  - type: AnimationPlayer
  - type: ReplacementAccent
    accent: silicon
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
  - type: Input
    context: "human"
  - type: InputMover
  - type: MobMover
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    layers:
    - map: ["enum.HumanoidVisualLayers.Chest"]
    - map: ["enum.HumanoidVisualLayers.Head"]
    - map: ["enum.HumanoidVisualLayers.Snout"]
    - map: ["enum.HumanoidVisualLayers.Eyes"]
    - map: ["enum.HumanoidVisualLayers.RArm"]
    - map: ["enum.HumanoidVisualLayers.LArm"]
    - map: ["enum.HumanoidVisualLayers.RLeg"]
    - map: ["enum.HumanoidVisualLayers.LLeg"]
    - shader: StencilMask
      map: ["enum.HumanoidVisualLayers.StencilMask"]
      sprite: Mobs/Customization/masking_helpers.rsi
      state: female_full
      visible: false
    - map: ["enum.HumanoidVisualLayers.LFoot"]
    - map: ["enum.HumanoidVisualLayers.RFoot"]
    - map: ["socks"]
    - map: ["underpants"]
    - map: ["undershirt"]
    - map: ["jumpsuit"]
    - map: ["enum.HumanoidVisualLayers.LHand"]
    - map: ["enum.HumanoidVisualLayers.RHand"]
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: ["id"]
    - map: ["gloves"]
    - map: ["shoes"]
    - map: ["ears"]
    - map: ["outerClothing"]
    - map: ["eyes"]
    - map: ["belt"]
    - map: ["neck"]
    - map: ["back"]
    - map: ["enum.HumanoidVisualLayers.FacialHair"]
    - map: ["enum.HumanoidVisualLayers.Hair"]
    - map: ["enum.HumanoidVisualLayers.HeadSide"]
    - map: ["enum.HumanoidVisualLayers.HeadTop"]
    - map: ["mask"]
    - map: ["head"]
    - map: ["pocket1"]
    - map: ["pocket2"]
    - map: ["enum.HumanoidVisualLayers.Tail"]
  - type: HumanoidAppearance
    species: Human
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 25
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5
  - type: Hands
  - type: Inventory
  - type: InventorySlots
  - type: Body
    prototype: Hologram
    requiredLegs: 2
  - type: DoAfter
  - type: Pullable
  - type: Examiner
  - type: Puller
  - type: StandingState
  - type: Crawler
  - type: Alerts
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: Stamina
  - type: StunVisuals
  - type: HealthExaminable
    examinableTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Shock
    - Cold
    - Caustic
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: LightningTarget
    priority: 2
    lightningExplode: false
  - type: Tag
    tags:
    - DoorBumpOpener
    - CanPilot
    - FootstepSound
    - SiliconEmotes
  - type: TypingIndicator
    proto: robot
  - type: Emoting
  - type: Grammar
    attributes:
      proper: true
  - type: MindContainer
    showExamineInfo: true
  - type: Actions
  - type: HologramActionGrant
    grantConsoleAction: true
    grantLawsAction: true
  - type: Eye
  - type: Access
  - type: MovementAlwaysTouching
  - type: Identity
  - type: IdExaminable
  - type: Buckle
  - type: CombatMode
    canDisarm: true
  - type: MeleeWeapon
    hidden: true
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 0
  - type: Cuffable
  - type: Ensnareable
    sprite: Objects/Misc/ensnare.rsi
    state: icon
  - type: Climbing
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-hologram
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-hologram-others
  - type: Stripping
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
      enum.HologramConsoleUiKey.Key:
        type: HologramConsoleBoundUserInterface
  - type: SiliconLawBound
  - type: SiliconLawProvider
    laws: Drone
  - type: Vocal
    sounds:
      Male: UnisexSilicon
      Female: UnisexSilicon
      Unsexed: UnisexSilicon
    screamId: Scream
    screamAction: ActionScream
  - type: HologramConsole
    maxActiveHolograms: 1
    showMap: true
    showProjectButton: true
    showRecallButton: true
    showBladeServerPanel: true

- type: entity
  name: Urist McLight
  parent: BaseHologramHumanoid
  id: MobHologramHardlight
  components:
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: HologramHardlight
  - type: HologramProjected
    gracePeriod: 2
    validationInterval: 0.25
    setEyeTarget: false
    validProjectorWhitelist:
      tags:
      - HoloProjectorServer
      - HoloProjectorCamera
    effectPrototype: EffectHologramProjectionBeam
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Stealth
    lastVisibility: 0.90
  - type: PointLight
    radius: 0.8
    softness: 0.4
    color: "#00FFFF"
    energy: 5
