- type: entity
  abstract: true
  parent: MobHuman
  id: BaseHologramHumanoid
  name: hologram
  components:
  - type: Hologram
  - type: MovementIgnoreGravity
  - type: NoSlip
  - type: FloatingVisuals
  - type: Stealth
    lastVisibility: 0.8
  - type: Grammar
    attributes:
      proper: true
  # Hardlight body: human controls/interactions, non-biological damage.
  # Runtime cleanup removes inherited bloodstream/respirator from MobHuman.
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: HologramHardlight
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Critical
      45: Dead
  - type: Body
    prototype: Hologram
    requiredLegs: 2
  - type: SiliconLawBound
  - type: SiliconLawProvider
    laws: Drone
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.SiliconLawsUiKey.Key:
        type: SiliconLawBoundUserInterface
  - type: Tag
    tags:
    - DoorBumpOpener
    - CanPilot
    - FootstepSound

- type: entity
  name: Urist McLight
  parent: BaseHologramHumanoid
  id: MobHologramHardlight
  components:
  - type: Hologram
  - type: HologramProjected
    gracePeriod: 0.08
    validProjectorWhitelist:
      tags:
      - HoloProjectorServer
      - HoloProjectorCamera
    effectPrototype: EffectHologramProjectionBeam
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: HologramHardlight
  - type: MobThresholds
    thresholds:
      0: Alive
      30: Critical
      45: Dead
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 6
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: MeleeWeapon
    soundHit:
      collection: GlassSmack
    angle: 30
    animation: WeaponArcFist
    attackRate: 1
    damage:
      types:
        Blunt: 5
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Stealth
    lastVisibility: 0.90
  - type: PointLight
    radius: 0.8
    softness: 0.4
    color: "#00FFFF"
    energy: 5

- type: entity
  id: MobHologramHardlightGhostRole
  parent: MobHologramHardlight
  name: hologram
  suffix: Ghost role random name
  categories: [ HideSpawnMenu ]
  components:
  - type: HologramRandomName
    nameDataset: NamesHologramJob

# Used for body chips that should project a hardlight corgi without being biological.
# If a blade currently points to MobCorgiSmartNoGalcom, the runtime cleanup still hardlight-ifies it,
# but new chips should prefer this prototype.
- type: entity
  id: MobHologramCorgiHardlight
  parent: MobCorgiSmartNoGalcom
  name: hologram corgi
  components:
  - type: Hologram
  - type: HologramProjected
    gracePeriod: 0.08
    validProjectorWhitelist:
      tags:
      - HoloProjectorServer
      - HoloProjectorCamera
    effectPrototype: EffectHologramProjectionBeam
  - type: MovementIgnoreGravity
  - type: NoSlip
  - type: FloatingVisuals
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: HologramHardlight
  - type: MobThresholds
    thresholds:
      0: Alive
      25: Critical
      35: Dead
  - type: SiliconLawBound
  - type: SiliconLawProvider
    laws: Drone
  - type: Stealth
    lastVisibility: 0.90
  - type: PointLight
    radius: 0.6
    softness: 0.35
    color: "#00FFFF"
    energy: 3
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
