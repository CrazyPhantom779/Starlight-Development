- type: entity
  id: HologramJobBrainChip
  parent: BaseItem
  name: hologram brain chip
  description: A stored crew consciousness waiting to be projected into hardlight.
  suffix: Job
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: generic
    color: "#45f3ff"
  - type: Item
    size: Tiny
  - type: Physics
    bodyType: KinematicController
  - type: MindContainer
  - type: Actions
  - type: HologramBrainChip
  - type: SiliconLawBound
  - type: SiliconLawProvider
    laws: Drone
  - type: Tag
    tags:
    - HologramBrainChip
    - HideContextMenu

- type: entity
  id: HologramJobBodyChip
  parent: BaseItem
  name: hologram body profile
  description: Stored body projection data for a hologram.
  suffix: Job
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: generic
    color: "#7dd3fc"
  - type: Item
    size: Tiny
  - type: HologramBodyChip
    hologramPrototype: MobHologramHardlight
    hologramName: hologram
  - type: Tag
    tags:
    - HologramBodyChip

- type: entity
  id: HologramJobBladeServer
  parent: HologramBladeServer
  name: hologram blade server
  suffix: Hologram job spawn
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  # Required by the real Moffstation BladeServerRack whitelist and rack visuals.
  - type: BladeServer
    stripeColor: "#45f3ffff"
  - type: HologramJobSpawn
    spawnOnJoin: false
  - type: HologramBladeServer
    normalLawset: Drone
    emaggedLawset: SyndicateStatic
  - type: HologramConsole
    maxActiveHolograms: 1
    showMap: true
    showProjectButton: true
    showRecallButton: true
    showBladeServerPanel: true
  - type: ActivatableUI
    key: enum.HologramConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.HologramConsoleUiKey.Key:
        type: HologramConsoleBoundUserInterface
  # Allows both round-start and runtime/latejoin testing.
  - type: ContainerSpawnPoint
    containerId: hologram_brain_chip
    job: Hologram
    spawnType: Unset
  - type: ItemSlots
    slots:
      hologram_brain_chip:
        name: Brain Chip
        whitelist:
          tags:
          - HologramBrainChip
      hologram_body_chip:
        name: Body Chip
        whitelist:
          tags:
          - HologramBodyChip
        startingItem: HologramJobBodyChip
  - type: ContainerContainer
    containers:
      hologram_brain_chip: !type:ContainerSlot
      hologram_body_chip: !type:ContainerSlot

- type: entity
  id: BladeServerRackHologramJob
  parent: BladeServerRack
  name: hologram blade server rack
  description: A rack of blade servers that stores hologram crew until they are projected.
  suffix: Hologram job spawn
  components:
  - type: BladeServerRack
    bladeServerVisualsOffset: 0, 0
    startingContents:
    - HologramJobBladeServer
    - HologramJobBladeServer
    - HologramJobBladeServer
    - HologramJobBladeServer

- type: entity
  id: BladeServerRackHologramJobSpawner
  parent: MarkerBase
  name: hologram blade server rack spawner
  suffix: Hologram job spawn
  components:
  - type: Sprite
    layers:
    - state: blue
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - id: BladeServerRackHologramJob

# Compatibility IDs for maps/admin muscle memory from earlier iterations.
- type: entity
  id: HologramJobServerRack
  parent: BladeServerRackHologramJob
  suffix: Hologram job spawn, compatibility

- type: entity
  id: HologramJobServerRackSpawner
  parent: BladeServerRackHologramJobSpawner
  name: hologram blade server rack spawner
  suffix: Hologram job spawn, compatibility
