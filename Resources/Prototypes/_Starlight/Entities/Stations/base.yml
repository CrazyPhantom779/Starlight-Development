- type: entity
  id: BaseStationCryoTeleportation
  abstract: true
  components:
  - type: StationCryoTeleportation

- type: entity
  id: BaseStationAlertArmories
  abstract: true
  components:
    - type: AlertArmoryStation
      shuttles:
        gamma:
          shuttle: /Maps/_Starlight/Shuttles/CC-NT/GammaWeaponry.yml
          announcement: announcement-gamma-armory
          recallAnnouncement: announcement-gamma-armory-recall
        psi:
          shuttle: /Maps/_Starlight/Shuttles/CC-NT/PsiArmory.yml
          announcement: announcement-psi-armory
          announcementColor: "#2288ff"
          recallAnnouncement: announcement-psi-armory-recall
          recallAnnouncementColor: "#2288ff"
        medical:
          shuttle: /Maps/_Starlight/Shuttles/CC-NT/EmergencyMedicalPod.yml
          announcement: announcement-med-pod
          announcementColor: "#34c3eb"
          recallAnnouncement: announcement-med-pod-recall
          recallAnnouncementColor: "#34c3eb"

- type: entity
  id: BaseStationShuttlesNoTrade
  abstract: true
  components:
    - type: StationCargoShuttle
      path: /Maps/Shuttles/cargo.yml
    - type: GridSpawn
      groups:
        cargo_salvage_shuttle: !type:GridSpawnGroup
          paths:
            - /Maps/_Starlight/Shuttles/Salvage/pioneer.yml
          nameGrid: false
        cargo_mining_shuttle: !type:GridSpawnGroup
          paths:
            - /Maps/_Starlight/Shuttles/Mining/breaker.yml
          nameGrid: false
        # Spawn last
        ruins: !type:GridSpawnGroup
          hide: true
          nameGrid: true
          minCount: 2
          maxCount: 3
          stationGrid: false
          paths:
          - /Maps/Ruins/abandoned_outpost.yml
          - /Maps/Ruins/atmos_interchange.yml
          - /Maps/Ruins/chunked_tcomms.yml
          - /Maps/Ruins/biodome_satellite.yml
          - /Maps/Ruins/derelict.yml
          - /Maps/Ruins/djstation.yml
          - /Maps/Ruins/empty_flagship.yml
          - /Maps/Ruins/hydro_outpost.yml
          - /Maps/Ruins/old_ai_sat.yml
          - /Maps/Ruins/ruined_prison_ship.yml
          - /Maps/Ruins/syndicate_dropship.yml
          - /Maps/Ruins/whiteship_ancient.yml
          - /Maps/Ruins/whiteship_bluespacejumper.yml
          - /Maps/Ruins/wrecklaimer.yml
          - /Maps/Ruins/displaced_telescience.yml
          - /Maps/_Starlight/Ruins/Salv_Sus.yml #Starlight
        wrecks: !type:DungeonSpawnGroup
          minimumDistance: 150
          maximumDistance: 300
          stationGrid: false
          minCount: 16 #SL Edit 12 > 16
          maxCount: 20 #SL Edit 16 > 20
          addComponents:
          - type: Gravity
            enabled: true
            inherent: true
          - type: IFF
            flags: HideLabel
            color: "#88b0d1"
          protos:
          - ChunkDebrisSmall
          - ChunkDebrisSmall
          - ChunkDebrisSmall
          - ChunkDebrisSmall
          - ChunkDebris
          - ClusterAsteroid
          - SpindlyAsteroid
          - BlobAsteroid
          - SwissCheeseAsteroid
          - ClusterTrash
          - SpindlyTrash
          - BlobAsteroidTrash
          - SwissCheeseTrash
          - ClusterTrash
          - SpindlyTrash
          - BlobAsteroidTrash
          - ClusterMeat
          - SpindlyMeat
          - BlobAsteroidSnow
          - ClusterSnow
          - SwissCheeseSnow
          - ChunkDebrisSmall
          - ChunkDebrisSmall
        vgroid: !type:DungeonSpawnGroup
          minimumDistance: 300
          maximumDistance: 350
          nameDataset: NamesBorer
          stationGrid: false
          addComponents:
          - type: Gravity
            enabled: true
            inherent: true
          protos:
          - VGRoid
