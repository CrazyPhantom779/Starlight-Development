# Base actions that every woven spell is created from. Name, description, cost and cooldown are set at runtime.
- type: entity
  parent: BaseAction
  id: ActionSpellGraphWorld
  name: woven spell
  description: A spell woven from glyphs.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: spell_default
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:SpellGraphWorldEvent
  - type: EorgPreventAction

- type: entity
  parent: BaseAction
  id: ActionSpellGraphInstant
  name: woven spell
  description: A spell woven from glyphs.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    raiseOnUser: true
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: spell_default
  - type: InstantAction
    event: !type:SpellGraphInstantEvent
  - type: EorgPreventAction
