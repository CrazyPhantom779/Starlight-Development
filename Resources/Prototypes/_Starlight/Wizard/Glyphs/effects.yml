# Effect glyphs wrap the events of existing spells. To make a new glyph from any spell, copy that spell's event here.

# --- aimed (World) ---
- type: spellGlyph
  id: EffectFirebolt
  category: Effect
  name: glyph-effect-firebolt-name
  description: glyph-effect-firebolt-desc
  cost: 8
  schools: [ Fire ]
  icon: { sprite: Objects/Magic/magicactions.rsi, state: fireball }
  worldEvent: !type:ProjectileSpellEvent
    prototype: ProjectileFirebolt

- type: spellGlyph
  id: EffectFireball
  category: Effect
  name: glyph-effect-fireball-name
  description: glyph-effect-fireball-desc
  cost: 30
  schools: [ Fire ]
  icon: { sprite: Objects/Magic/magicactions.rsi, state: fireball }
  worldEvent: !type:ProjectileSpellEvent
    prototype: ProjectileFireball

- type: spellGlyph
  id: EffectBlink
  category: Effect
  name: glyph-effect-blink-name
  description: glyph-effect-blink-desc
