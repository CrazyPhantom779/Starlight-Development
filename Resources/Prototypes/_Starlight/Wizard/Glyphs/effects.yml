  icon: { sprite: Objects/Magic/magicactions.rsi, state: blink }
  worldEvent: !type:TeleportSpellEvent {}

- type: spellGlyph
  id: EffectCarp
  category: Effect
  name: glyph-effect-carp-name
  description: glyph-effect-carp-desc
  cost: 22
  schools: [ Nature ]
  icon: { sprite: Objects/Magic/magicactions.rsi, state: spell_default }
  worldEvent: !type:WorldSpawnSpellEvent
    prototypes:
    - id: MobCarpMagic
      amount: 2
    offset: 0, 1

