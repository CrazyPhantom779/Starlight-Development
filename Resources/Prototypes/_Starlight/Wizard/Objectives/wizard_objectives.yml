# Thefts: things worth having a wizard take.
- type: entity
  abstract: true
  parent: [ BaseWizardObjective, BaseStealObjective ]
  id: BaseWizardStealObjective
  components:
  - type: Objective
    difficulty: 1.5
  - type: StealCondition
    verifyMapExistence: false

- type: entity
  parent: BaseWizardStealObjective
  id: WizardStealIdObjective
  components:
  - type: StealCondition
    stealGroup: CaptainIDCard

- type: entity
  parent: BaseWizardStealObjective
  id: WizardStealTeleporterObjective
  components:
  - type: StealCondition
    stealGroup: HandTeleporter

- type: entity
  parent: BaseWizardStealObjective
  id: WizardStealClipboardObjective
  components:
  - type: StealCondition
    stealGroup: BoxFolderQmClipboard

# Group weights
- type: weightedRandom
  id: WizardObjectiveGroups
  weights:
    WizardObjectiveGroupSpells: 1
    WizardObjectiveGroupThefts: 0.7
    WizardObjectiveGroupShowOff: 0.5
    WizardObjectiveGroupCraft: 0.8
    WizardObjectiveGroupGrowth: 0.7

- type: weightedRandom
  id: WizardObjectiveGroupSpells
  weights:
    WizardCastObjective: 1
    WizardWeaveObjective: 1
    WizardVarietyObjective: 1
    WizardOvercastObjective: 0.5

- type: weightedRandom
  id: WizardObjectiveGroupThefts
  weights:
    WizardStealIdObjective: 1
    WizardStealTeleporterObjective: 1
    WizardStealClipboardObjective: 0.6

- type: weightedRandom
  id: WizardObjectiveGroupShowOff
  weights:
    WizardDemonstrateObjective: 1

- type: weightedRandom
  id: WizardObjectiveGroupCraft
  weights:
    WizardRitesObjective: 1
    WizardCardsObjective: 1
    WizardScrollsObjective: 0.8
    WizardStoredObjective: 1

- type: weightedRandom
  id: WizardObjectiveGroupGrowth
  weights:
    WizardCreaturesObjective: 1
    WizardSchoolsObjective: 1
    WizardErrandsObjective: 0.8
    WizardWindObjective: 0.7
